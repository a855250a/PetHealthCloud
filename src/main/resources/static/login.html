<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetHealthCloud</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

    <h1>PetHealthCloud</h1>
    <p>Pet Health Management System</p>

    <div class="card">
        <h2>會員登入</h2>
        <input id="email" type="email" placeholder="電子郵件">
        <input id="password" type="password" placeholder="密碼">
        <button id="loginButton">登入</button>
    </div>

    <div class="guest-login">
    <p>或</p>

    <button id="guestLoginButton" type="button">
        🐾 訪客體驗登入
    </button>

    <p class="guest-hint">
        無需註冊，直接體驗 PetHealthCloud
    </p>
    </div>
        
    </div>
    <script src="script.js?v=0.6"></script>
</body>
</html>
